<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quello della Sicurezza</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #0f0f0f);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 520px;
      padding: 30px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: #222;
      border-radius: 20px;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 15px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #aaa;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      margin: 10px auto;
      padding: 15px;
      width: 100%;
      max-width: 320px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .substack { background: #ff6719; }
    .x { background: #1da1f2; }
    .instagram { background: #e1306c; }

    .btn:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="badge">🔐 Sicurezza • Contenuti • Insight</div>

    <h1>Quello che non pubblico altrove.</h1>

    <p>
      Analisi, contenuti e idee sul mondo della sicurezza digitale e reale.
      Diretto, senza rumore.
    </p>

    <!-- SUBSTACK (PRINCIPALE) -->
    <a class="btn substack" href="https://quellodellasicurezza.substack.com" target="_blank">
      📬 Iscriviti su Substack
    </a>

    <!-- X -->
    <a class="btn x" href="https://x.com/QSicurezza52568" target="_blank">
      🐦 Seguimi su X
    </a>

    <!-- INSTAGRAM -->
    <a class="btn instagram" href="https://instagram.com/quellodellasicurezza" target="_blank">
      📸 Instagram
    </a>

    <div class="footer">
      © Quello della Sicurezza — contenuti aggiornati regolarmente
    </div>

  </div>
</body>
</html>
