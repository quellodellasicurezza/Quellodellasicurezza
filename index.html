<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Quello della Sicurezza</title>

<meta name="description" content="Analisi indipendenti su rischio, sicurezza reale e segnali deboli.">

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #eaeaea;
  display: flex;
  flex-direction: column;
  align-items: center;
}


.container {
  max-width: 520px;
  padding: 50px 20px;
  text-align: center;
}


.avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 2px solid #222;
  filter: grayscale(100%);
  transition: .3s ease;
}


.avatar:hover {
  filter: grayscale(0%);
  transform: scale(1.03);
}


h1 {
  font-size: 24px;
  margin-bottom: 10px;
}


.bio {
  font-size: 15px;
  color: #cfcfcf;
  margin-bottom: 25px;
}


.section {
  font-size: 13px;
  color: #888;
  margin-bottom: 30px;
}


/* PULSANTI */

.buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 30px;
}


.btn {

  padding: 14px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  border: 1px solid #2a2a2a;
  color: #eaeaea;
  background: #111;

}


.btn:hover {

background:#1a1a1a;

}



a,
a:visited {

color:#eaeaea;
text-decoration:none;

}


/* WIDGET */

.widget {

border:1px solid #222;
border-radius:12px;
padding:16px;
background:#111;
margin-bottom:20px;
text-align:left;

}


.widget-title {

font-size:11px;
color:#ff6719;
text-transform:uppercase;
margin-bottom:8px;

}


/* CARD ARTICOLI */

.newsletter-card {

border-top:1px solid #222;
padding-top:18px;
margin-top:18px;

}


.newsletter-card img {

max-width:100%;
border-radius:10px;

}


.newsletter-card h3 {

font-size:18px;
margin:10px 0;

}


.newsletter-card p {

font-size:14px;
line-height:1.5;
color:#bbb;

}


.date {

font-size:12px;
color:#666;
margin-bottom:12px;

}


.read {

display:inline-block;
padding:10px 14px;
border-radius:8px;
background:#1a1a1a;
border:1px solid #333;

}


/* FOOTER */

footer {

width:100%;
text-align:center;
padding:20px;
font-size:11px;
color:#555;
border-top:1px solid #111;
margin-top:40px;

}

</style>

</head>



<body>


<div class="container">


<img 
src="quellodellasicurezza.jpg" 
class="avatar"
alt="Quello della Sicurezza">



<h1>
Quello della Sicurezza
</h1>



<div class="bio">

Analisi indipendenti su rischio e sicurezza reale.

</div>



<div class="section">

Guardia Giurata con esperienza decennale.<br>
Leggo segnali deboli prima che diventino problemi

</div>





<!-- 1 - ULTIMA ANALISI -->

<div class="widget">

<div id="substack-widget">

Caricamento ultima analisi...

</div>

</div>





<!-- 2 - ARCHIVIO -->

<div class="widget">

<div id="archive-widget">

Caricamento archivio...

</div>

</div>





<!-- 3 e 4 - AZIONI -->

<div class="buttons">


<a 
class="btn"
href="https://quellodellasicurezza.substack.com/subscribe"
target="_blank">

Iscriviti alla Newsletter

</a>



<a 
class="btn"
href="https://instagram.com/quellodellasicurezza"
target="_blank">

Instagram

</a>


</div>



</div>




<footer>

Copyright 2026 - Quello della Sicurezza

</footer>





<script>


fetch("latest-newsletter.html")

.then(response => {

if(!response.ok)
throw new Error();

return response.text();

})

.then(html=>{

document.getElementById(
"substack-widget"
).innerHTML=html;

})

.catch(()=>{

document.getElementById(
"substack-widget"
).innerHTML=
"Nuova analisi in arrivo.";

});




fetch("archive-newsletter.html")

.then(response => {

if(!response.ok)
throw new Error();

return response.text();

})

.then(html=>{

document.getElementById(
"archive-widget"
).innerHTML=html;

})

.catch(()=>{

document.getElementById(
"archive-widget"
).innerHTML=
"Archivio non disponibile.";

});


</script>



</body>

</html>
