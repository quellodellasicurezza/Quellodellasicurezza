<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La mia Landing Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      margin: 10px auto;
      padding: 15px;
      width: 100%;
      max-width: 300px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .substack { background: #ff6719; }
    .x { background: #1da1f2; }
    .instagram { background: #e1306c; }

    .btn:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Benvenuto 👋</h1>
    <p>Seguimi sulle mie piattaforme</p>

    <a class="btn substack" href="https://quellodellasicurezza.substack.com" target="_blank">
      Substack
    </a>

    <a class="btn x" href="https://x.com/QSicurezza52568" target="_blank">
      X (Twitter)
    </a>

    <a class="btn instagram" href="https://instagram.com/quellodellasicurezza" target="_blank">
      Instagram
    </a>
  </div>
</body>
</html>
