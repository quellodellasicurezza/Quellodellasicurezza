name: Aggiorna newsletter Substack

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

    - name: Scarica repository
      uses: actions/checkout@v4

    - name: Configura Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Installa dipendenze
      run: npm install

    - name: Aggiorna widget
      run: node scripts/update-substack.js

    - name: Salva modifica
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add latest-newsletter.html
        git commit -m "Aggiornamento newsletter" || exit 0
        git push
